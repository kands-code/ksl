[package]
name = "ksl-runtime"
description = "ksl 运行时"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
arcstr = "1.2"
crossbeam-channel = "0.5"
crossterm = { version = "0.29", default-features = false, features = [
  "bracketed-paste",
  "events",
  "windows",
] }
imbl = "7.0.2"
indexmap = "2.14.2"
jiff = { version = "1.0.1", features = ["tzdb-bundle-always"] }
libloading = "0.9"
mio = { version = "1", default-features = false, features = [
  "net",
  "os-ext",
  "os-poll",
] }
ksl-base = { version = "0.1.0", path = "../ksl-base" }
ksl-catalog = { version = "0.1.0", path = "../ksl-catalog" }
ksl-frontend = { version = "0.1.0", path = "../ksl-frontend" }
ksl-plugin = { version = "0.1.0", path = "../ksl-plugin" }
parking_lot = "0.13.0"
regex-automata = "0.4"
regex-syntax = "0.8"
shared_child = { version = "1.1", default-features = false }
socket2 = "0.6"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"

[lints]
workspace = true
