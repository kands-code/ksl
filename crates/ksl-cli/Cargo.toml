[package]
name = "ksl-cli"
description = "ksl 命令行"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "ksl"
path = "src/main.rs"

# tests/common.rs 是各集成测试共享的辅助代码, 不作为独立测试目标.
[[test]]
name = "common"
test = false
bench = false

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[dependencies]
crossbeam-channel = "0.5"
crossterm = { version = "0.29", default-features = false, features = [
  "bracketed-paste",
  "events",
  "windows",
] }
ksl-base = { version = "0.1.0", path = "../ksl-base" }
ksl-catalog = { version = "0.1.0", path = "../ksl-catalog" }
ksl-frontend = { version = "0.1.0", path = "../ksl-frontend" }
ksl-runtime = { version = "0.1.0", path = "../ksl-runtime" }
lsp-server = "0.10"
lsp-types = { package = "gen-lsp-types", version = "0.11.0", features = [
  "url",
] }
mimalloc = { version = "0.1.52", features = ["v2"], optional = true }
serde_json = "1.0.154"

[lints]
workspace = true
