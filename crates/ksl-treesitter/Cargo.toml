[package]
name = "ksl-treesitter"
description = "ksl tree-sitter 语法"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[lib]
path = "src/lib.rs"

[dependencies]
tree-sitter-language = "0.1.9"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
ksl-base = { version = "0.1.0", path = "../ksl-base" }
ksl-catalog = { version = "0.1.0", path = "../ksl-catalog" }
ksl-frontend = { version = "0.1.0", path = "../ksl-frontend" }
ksl-runtime = { version = "0.1.0", path = "../ksl-runtime" }
tree-sitter = "0.27.2"

[lints]
workspace = true
